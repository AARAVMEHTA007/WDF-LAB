<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Student Hub</title>
    <link rel="stylesheet" href="../css/studentHub.css">
</head>
<body>
   
    <header>
        <h1>User Login</h1>
        <p>Access Your Student Hub Account & Dashboard</p>
    </header>

    <nav>
        <a href="../index.html"><i class="fas fa-arrow-left"></i> Back to Home Page</a>
        <a href="register.html"><i class="fas fa-user-plus"></i> Register Account</a>
    </nav>

    <main>
        <section style="max-width: 580px; margin-left: auto; margin-right: auto;">
            <h2><i class="fas fa-sign-in-alt"></i> Account Sign In</h2>
            
            <form action="" method="">
                <p>
                    <label for="username"><i class="fas fa-user"></i> Username or Email:</label>
                    <input type="text" id="username" name="username" required placeholder="Enter your username or email">
                </p>

                <p>
                    <label for="password"><i class="fas fa-lock"></i> Password:</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </p>

                <p style="margin-top: 10px;">
                    <button type="submit"><i class="fas fa-key"></i> Log In</button>
                </p>
            </form>
        </section>

        <section style="max-width: 580px; margin-left: auto; margin-right: auto; text-align: center;">
            <p>Don't have a Student Hub account yet?</p>
            <p style="margin-top: 14px;">
                <a href="register.html">
                    <button type="button" style="background: transparent; border: 1.5px solid var(--primary); color: var(--text-main);"><i class="fas fa-user-plus"></i> Create New Account</button>
                </a>
            </p>
        </section>
    </main>

    <footer>
        <p>Copyright © 2026 Student Hub</p>
    </footer>
</body>
</html>
