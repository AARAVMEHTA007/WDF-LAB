<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback — Student Hub</title>
    <link rel="stylesheet" href="../css/studentHub.css">
</head>
<body>
  
    <header>
        <h1>User Feedback</h1>
        <p>Your Thoughts Help Drive Continuous Improvement & UX Excellence</p>
    </header>

    <nav>
        <a href="../index.html"><i class="fas fa-arrow-left"></i> Back to Home Page</a>
    </nav>

    <main>
        <section style="max-width: 620px; margin-left: auto; margin-right: auto;">
            <h2><i class="fas fa-comment-dots"></i> Share Your Feedback</h2>
            <form action="" method="">
                <p>
                    <label for="fb-name"><i class="fas fa-user"></i> Your Name:</label>
                    <input type="text" id="fb-name" name="fb-name" placeholder="Enter your full name">
                </p>
                <p>
                    <label for="fb-email"><i class="fas fa-envelope"></i> Your Email:</label>
                    <input type="email" id="fb-email" name="fb-email" placeholder="name@example.com">
                </p>
                <p>
                    <label for="fb-rating"><i class="fas fa-star" style="color: var(--accent-amber);"></i> Overall Site Experience:</label>
                    <select id="fb-rating" name="fb-rating">
                        <option value="5">⭐⭐⭐⭐⭐ 5 - Exceptional UI & Design</option>
                        <option value="4">⭐⭐⭐⭐ 4 - Very Good & Responsive</option>
                        <option value="3">⭐⭐⭐ 3 - Average Experience</option>
                        <option value="2">⭐⭐ 2 - Needs Improvement</option>
                        <option value="1">⭐ 1 - Poor</option>
                    </select>
                </p>
                <p>
                    <label for="fb-comments"><i class="fas fa-pen"></i> Detailed Comments & Suggestions:</label>
                    <textarea id="fb-comments" name="fb-comments" rows="5" placeholder="What features did you enjoy? What can be improved further?"></textarea>
                </p>
                <p style="margin-top: 10px;">
                    <button type="submit"><i class="fas fa-paper-plane"></i> Submit Feedback</button>
                </p>
            </form>
        </section>

        <section style="max-width: 620px; margin-left: auto; margin-right: auto; text-align: center;">
            <p><i class="fas fa-heart" style="color: var(--accent-rose);"></i> Thank you for taking the time to share your Feedback with us!</p>
        </section>
    </main>

    <footer>
        <p>Copyright © 2026 Student Hub</p>
    </footer>
</body>
</html>
