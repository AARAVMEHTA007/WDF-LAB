<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Student Hub</title>
    <link rel="stylesheet" href="../css/studentHub.css">
</head>
<body>
    
    <header>
        <h1>Get In Touch</h1>
        <p>Connect for Academic Collaborations, Project Inquiries, or Questions</p>
    </header>

    <nav>
        <a href="../index.html"><i class="fas fa-arrow-left"></i> Back to Home Page</a>
        <a href="faq.html"><i class="fas fa-question-circle"></i> View FAQ</a>

        <div class="theme-toggle-wrapper">
            <button type="button" class="theme-btn theme-btn-light active" id="theme-light-btn" aria-label="Light Mode"><i class="fas fa-sun"></i> Light</button>
            <button type="button" class="theme-btn theme-btn-dark" id="theme-dark-btn" aria-label="Dark Mode"><i class="fas fa-moon"></i> Dark</button>
        </div>
    </nav>

    <main>
        <section>
            <h2><i class="fas fa-address-book"></i> Direct Contact Details</h2>
            <ul>
                <li><strong><i class="fas fa-envelope" style="color: var(--accent-cyan);"></i> Email:</strong> <a href="mailto:student@email.com">student@email.com</a></li>
                <li><strong><i class="fab fa-github" style="color: var(--accent-violet);"></i> GitHub:</strong> <a href="https://github.com" target="_blank">github.com/your-username</a></li>
                <li><strong><i class="fab fa-linkedin" style="color: var(--accent-emerald);"></i> LinkedIn:</strong> <a href="https://linkedin.com" target="_blank">linkedin.com/in/your-username</a></li>
            </ul>
        </section>

        <section>
            <h2><i class="fas fa-paper-plane"></i> Send a Direct Message</h2>
            <form action="" method="">
                <p>
                    <label for="name"><i class="fas fa-user"></i> Your Name:</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name">
                </p>
                <p>
                    <label for="email"><i class="fas fa-envelope"></i> Your Email:</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </p>
                <p>
                    <label for="message"><i class="fas fa-comment-alt"></i> Message:</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Write your message or inquiry here..."></textarea>
                </p>
                <p>
                    <button type="submit"><i class="fas fa-paper-plane"></i> Send Message</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>Copyright © 2026 Student Hub</p>
    </footer>
    <script src="../js/main.js" defer></script>
</body>
</html>
